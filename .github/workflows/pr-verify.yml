name: PR Verify

# Gate every pull request on the single deterministic verification command
# (MFP-08): shared package + typecheck + server + client + web build.

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
