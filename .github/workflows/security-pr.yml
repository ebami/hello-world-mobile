name: Security (PR)

# Supply-chain + source security gates on every pull request (MFP-12).
#
# Forked-PR safety: the `pull_request` trigger (NOT `pull_request_target`) plus
# read-only default permissions means fork runs never receive deployment
# credentials or production secrets. Mandatory gates must NOT use
# continue-on-error — a failure blocks the merge.
#
# Third-party actions should be pinned to an immutable commit SHA; the version
# tags below are placeholders to replace with SHAs during setup.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependency review (block High+)
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Block on High+ in runtime dependencies. Document any temporary waiver in
      # docs/security/exceptions.md (moderate findings are below this threshold
      # and are handled by Dependabot + the dependency-review gate above).
      - name: npm audit (runtime deps — block High+)
        run: npm audit --audit-level=high --omit=dev

  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: OSV scanner
        uses: google/osv-scanner-action@v1 # TODO: pin by commit SHA
        with:
          scan-args: |-
            --lockfile=package-lock.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the scan covers the whole diff range
      - name: Gitleaks (verified secret blocks the build)
        uses: gitleaks/gitleaks-action@v3 # TODO: pin by commit SHA
